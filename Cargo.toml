[package]
name = "TradingRoguelike"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20.0", features = ["sysinfo_plugin"] }
bevy_egui = "0.43"
rand = "0.10"
strum = { version = "0.27", features = ["derive"] }

[features]
default = ["dev"]
dev = ["bevy/dynamic_linking"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
